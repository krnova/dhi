name: Build Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle
          key: gradle-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Set version from tag
        run: |
          TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          VERSION_NAME="${TAG#v}"
          # Derive versionCode from tag — strip non-numeric chars and use as integer
          # e.g. v0.2.0-alpha → 020 → pad to int → 20. Simple and monotonic.
          VERSION_CODE=$(echo "$VERSION_NAME" | tr -cd '0-9' | sed 's/^0*//' | head -c 9)
          VERSION_CODE=${VERSION_CODE:-1}
          sed -i "s/versionName .*/versionName \"${VERSION_NAME}\"/" android/app/build.gradle
          sed -i "s/versionCode .*/versionCode ${VERSION_CODE}/" android/app/build.gradle
          echo "VERSION_NAME=${VERSION_NAME}" >> $GITHUB_ENV
          echo "TAG=${TAG}" >> $GITHUB_ENV
          echo "Set versionName=${VERSION_NAME}, versionCode=${VERSION_CODE}"

      - name: Check for signing secrets
        id: check_secrets
        run: |
          if [ -z "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "signing=false" >> $GITHUB_OUTPUT
            echo "⚠️ No keystore secrets — building unsigned APK"
          else
            echo "signing=true" >> $GITHUB_OUTPUT
            echo "✅ Keystore found — building signed APK"
          fi

      - name: Decode keystore
        if: steps.check_secrets.outputs.signing == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo $KEYSTORE_BASE64 | base64 -di > android/app/release.keystore

      - name: Write keystore.properties
        if: steps.check_secrets.outputs.signing == 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cat > android/keystore.properties << EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=release.keystore
          EOF

      - name: Grant gradlew permission
        run: chmod +x android/gradlew

      - name: Build Release APK
        run: cd android && ./gradlew assembleRelease --no-daemon --build-cache

      - name: Rename APK
        run: |
          SUFFIX=$([[ "${{ steps.check_secrets.outputs.signing }}" == "true" ]] && echo "signed" || echo "unsigned")
          SRC_SIGNED="android/app/build/outputs/apk/release/app-release.apk"
          SRC_UNSIGNED="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          DEST="android/app/build/outputs/apk/release/dhi-${{ env.TAG }}-${SUFFIX}.apk"
          if [ -f "$SRC_SIGNED" ]; then mv "$SRC_SIGNED" "$DEST"
          elif [ -f "$SRC_UNSIGNED" ]; then mv "$SRC_UNSIGNED" "$DEST"
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dhi-${{ env.TAG }}
          path: android/app/build/outputs/apk/release/dhi-*.apk
          retention-days: 90

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: android/app/build/outputs/apk/release/dhi-*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
